# Entorno desechable de contratos; nunca reutilizar el volumen de la tienda.
name: la-cosecha-qa
services:
  mysql:
    image: mysql:8.0.46
    ports:
      - "127.0.0.1:33306:3306"
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: la_cosecha_soa_test
      MYSQL_USER: ${DB_USER:?Ejecuta configure --test}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Ejecuta configure --test}
    volumes:
      - qa-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  qa-mysql:
